name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Hexagonal Architecture boundaries
        run: go test -count=1 -v ./test/architecture
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Buf formatting, lint and generated code
        run: sh scripts/generate-proto.sh --check
      - name: Diff whitespace
        run: git diff --check

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require Docker and Compose
        run: |
          docker info > /dev/null
          docker compose version
      - name: Extractor PostgreSQL
        run: bash scripts/ci-integration.sh extractor-postgres
      - name: Transformer PostgreSQL
        run: bash scripts/ci-integration.sh transformer-postgres
      - name: Loader PostgreSQL
        run: bash scripts/ci-integration.sh loader-postgres
      - name: Stage 9 handoff
        run: bash scripts/ci-integration.sh handoff-postgres
      - name: Stage 11 full fixture E2E
        run: bash scripts/ci-integration.sh fixture-e2e
      - name: Stage 12.5 backup, restore and storage measurements
        run: bash scripts/ci-integration.sh storage-release
